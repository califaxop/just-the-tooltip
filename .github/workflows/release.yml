# Releases the addon to CurseForge whenever a push to main changes the toc's "## Version:".
# The upload notes are that version's line under "Recent changes" in README.md.
# After a successful upload, the version is tagged (v1.2.3); a tagged version is never uploaded again.
# Needs the repository secret PJ_API_KEY (a CurseForge API token).
# "Run workflow" on the Actions tab releases the current version by hand (unless it's already tagged).
name: Release

on:
  push:
    branches: [main]
    paths: ["*.toc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

env:
  GAME_VERSION: "1.60.1"   # the WoW: Forever version on CurseForge

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Should this version be released?
        id: check
        run: |
          TOC=$(ls *.toc | head -n1)
          ADDON=${TOC%.toc}
          VERSION=$(sed -n 's/^## Version: *//p' "$TOC" | tr -d '\r')
          PROJECT_ID=$(sed -n 's/^## X-Curse-Project-ID: *//p' "$TOC" | tr -d '\r')
          if [ -z "$VERSION" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::$TOC needs ## Version and ## X-Curse-Project-ID"; exit 1
          fi
          # the file on CurseForge is named after the in-game title ("Hereabouts 1.2.3",
          # Hereabouts-1.2.3.zip); the folder inside the zip keeps the addon's folder name
          TITLE=$(sed -n 's/^## Title: *//p' "$TOC" | tr -d '\r')
          [ -n "$TITLE" ] || TITLE="$ADDON"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "ZIPNAME=$(echo "$TITLE" | tr -cd 'A-Za-z0-9')-$VERSION.zip" >> "$GITHUB_ENV"  # letters and digits only
          echo "ADDON=$ADDON" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          RELEASE=yes
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released"; RELEASE=no
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            OLD=$(git show "${{ github.event.before }}:$TOC" 2>/dev/null | sed -n 's/^## Version: *//p' | tr -d '\r')
            if [ "$OLD" = "$VERSION" ]; then echo "version unchanged ($VERSION)"; RELEASE=no; fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        if: steps.check.outputs.release == 'yes'
        run: |
          mkdir -p ".release/$ADDON"
          # extra addon folders shipped next to this one (listed in .extra-addons, one per line)
          EXTRA=$(cat .extra-addons 2>/dev/null | tr -d '\r' | xargs)
          EXCL=""; for d in $EXTRA; do EXCL="$EXCL --exclude=/$d"; done
          rsync -a --exclude='.git*' --exclude='.github' --exclude='.release' --exclude='.extra-addons' $EXCL \
            --exclude='README.md' --exclude='CHANGELOG.md' --exclude='*.zip' ./ ".release/$ADDON/"
          for d in $EXTRA; do cp -r "$d" ".release/$d"; done
          (cd .release && zip -qr "$ZIPNAME" "$ADDON" $EXTRA)
          unzip -l ".release/$ZIPNAME"

      - name: Upload to CurseForge
        if: steps.check.outputs.release == 'yes'
        env:
          CF_API_KEY: ${{ secrets.PJ_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::The PJ_API_KEY secret is missing: add it under Settings > Secrets and variables > Actions > Repository secrets"; exit 1
          fi
          API=https://wow.curseforge.com/api
          GV=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" "$API/game/versions" \
            | jq -r --arg n "$GAME_VERSION" '[.[] | select(.name == $n)][0].id // empty')
          if [ -z "$GV" ]; then echo "::error::CurseForge has no game version named $GAME_VERSION"; exit 1; fi
          # the line reads "- **1.2.3:** what changed": keep just "what changed"
          NOTES=$( (grep -m1 -F -- "- **$VERSION:**" README.md || grep -m1 -F -- "- $VERSION:" README.md || true) \
            | sed -E 's/^- (\*\*)?[^ ]+:(\*\*)? *//')
          [ -n "$NOTES" ] || NOTES="Version $VERSION"
          echo "$NOTES" > .release/notes.txt
          # metadata goes in a file: curl would cut a ";" in the changelog text short
          jq -cn --arg name "$TITLE $VERSION" --arg notes "$NOTES" --argjson gv "$GV" \
            '{displayName: $name, releaseType: "release", gameVersions: [$gv], changelog: $notes, changelogType: "markdown"}' \
            > .release/metadata.json
          cat .release/metadata.json
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<.release/metadata.json" -F "file=@.release/$ZIPNAME" \
            "$API/projects/$PROJECT_ID/upload-file"
          echo
          echo "Uploaded $TITLE $VERSION ($ZIPNAME) to CurseForge project $PROJECT_ID"

      - name: Tag the released version
        if: steps.check.outputs.release == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -F .release/notes.txt
          git push origin "v$VERSION"
